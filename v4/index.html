<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英打遊戲版本四 - 十鍵掉落字母</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #fffdf9;
            --primary-accent: #e67e22;
            --active-key-bg: #fdebd0;
            --active-key-border: #e67e22;
            --text-color: #5c4b43;
            --btn-start: #78a55a;
            --btn-stop: #e76f51;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#f0e6d2 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        .header {
            width: 100%;
            max-width: 720px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            padding: 8px 18px;
            border: 2px solid #e6d7c3;
            border-radius: 20px;
            background: #fbf7f0;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #e6d7c3;
            transform: translateY(-2px);
        }

        .game-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(180, 150, 120, 0.15);
            border: 2px solid #f3e9d8;
            text-align: center;
            width: 100%;
            max-width: 720px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-size: 18px;
            font-weight: 700;
            color: #7a685d;
            margin-bottom: 15px;
            background: #fdf8f0;
            padding: 10px;
            border-radius: 12px;
        }

        .stats-bar span { color: var(--primary-accent); }

        /* 掉落遊戲區域 */
        .game-area {
            position: relative;
            width: 100%;
            height: 220px;
            background: #f9f3ea;
            border-radius: 16px;
            border: 2px dashed #e2d2bc;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .falling-letter {
            position: absolute;
            font-size: 38px;
            font-weight: 800;
            color: #e67e22;
            background: #ffffff;
            width: 55px;
            height: 55px;
            line-height: 55px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #e67e22;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
            top: 0;
            user-select: none;
        }

        /* 設定面板 (滑桿與選態) */
        .settings-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: #f4ece1;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
            flex-wrap: wrap;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .btn-start { background: var(--btn-start); color: white; }
        .btn-stop { background: var(--btn-stop); color: white; }

        /* 鍵盤面板 */
        .keyboard-wrapper {
            background: #f4ece1;
            padding: 15px;
            border-radius: 18px;
            border: 1px solid #e5d8c5;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .kb-row { display: flex; gap: 5px; }

        .key {
            width: 44px;
            height: 44px;
            border: 1px solid #dcd0bf;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            color: #705f55;
            background: #ffffff;
            box-shadow: 0 3px 0 #d8c9b4;
            user-select: none;
        }

        .key.active {
            border-color: var(--active-key-border);
            background: var(--active-key-bg);
            color: #d35400;
            box-shadow: 0 2px 0 var(--active-key-border);
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="../index.html" class="back-btn">← 回首頁</a>
        <h2>版本四：十鍵掉落字母練習</h2>
    </div>

    <div class="game-card">
        <div class="stats-bar">
            <div>得分：<span id="score">0</span></div>
            <div>剩餘題數：<span id="remaining">10</span></div>
            <div>落地錯過：<span id="missed">0</span></div>
        </div>

        <div class="game-area" id="gameArea">
            <div id="fallingLetter" class="falling-letter" style="display: none;">A</div>
        </div>

        <!-- 試玩設定：預設 12 秒 (適合新手) -->
        <div class="settings-panel">
            <label>
                落地時間：<span id="speedVal">12</span> 秒
                <input type="range" id="speedSlider" min="3" max="14" value="12" oninput="updateSpeedVal(this.value)">
            </label>
            <label>
                <input type="checkbox" id="accelCheck"> 漸進加速（每答對 3 題快 1 秒）
            </label>
        </div>

        <div class="controls">
            <button class="btn-start" onclick="startGame()">開始遊戲</button>
            <button class="btn-stop" onclick="stopGame()">停止遊戲</button>
        </div>

        <!-- 十鍵實體鍵盤展示 -->
        <div class="keyboard-wrapper">
            <div class="kb-row">
                <div class="key" id="key-A">A</div>
                <div class="key" id="key-S">S</div>
                <div class="key" id="key-D">D</div>
                <div class="key" id="key-F">F</div>
                <div class="key" id="key-G">G</div>
                <div class="key" id="key-H">H</div>
                <div class="key" id="key-J">J</div>
                <div class="key" id="key-K">K</div>
                <div class="key" id="key-L">L</div>
                <div class="key" id="key-;">;</div>
            </div>
        </div>
    </div>

    <script>
        const keys = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';'];
        let currentTarget = '';
        let score = 0;
        let missed = 0;
        let totalCount = 0;
        let isPlaying = false;
        let isKeyDown = false;

        let animationFrameId = null;
        let startTime = null;
        let baseDuration = 12000; // 預設 12 秒
        let currentDuration = 12000;

        function updateSpeedVal(val) {
            document.getElementById('speedVal').innerText = val;
            baseDuration = val * 1000;
        }

        function startGame() {
            score = 0;
            missed = 0;
            totalCount = 0;
            isPlaying = true;
            document.getElementById('score').innerText = score;
            document.getElementById('missed').innerText = missed;
            document.getElementById('remaining').innerText = 10;
            nextQuestion();
        }

        function stopGame() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            const letterEl = document.getElementById('fallingLetter');
            letterEl.style.display = 'none';
            clearHighlights();
        }

        function nextQuestion() {
            if (!isPlaying) return;

            if (totalCount >= 10) {
                isPlaying = false;
                clearHighlights();
                document.getElementById('fallingLetter').style.display = 'none';
                alert(`遊戲結束！\n總答對分數：${score}\n錯過落地：${missed}`);
                return;
            }

            totalCount++;
            document.getElementById('remaining').innerText = 11 - totalCount;

            // 計算漸進加速
            const isAccel = document.getElementById('accelCheck').checked;
            if (isAccel) {
                const speedBoost = Math.floor(score / 3) * 1000;
                currentDuration = Math.max(3000, baseDuration - speedBoost);
            } else {
                currentDuration = baseDuration;
            }

            clearHighlights();
            const randomIndex = Math.floor(Math.random() * keys.length);
            currentTarget = keys[randomIndex];

            const letterEl = document.getElementById('fallingLetter');
            letterEl.innerText = currentTarget;
            letterEl.style.display = 'block';
            letterEl.style.top = '0px';

            const keyEl = document.getElementById(`key-${currentTarget}`);
            if (keyEl) keyEl.classList.add('active');

            startTime = performance.now();
            cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(animateDrop);
        }

        function animateDrop(currentTime) {
            if (!isPlaying) return;
            const elapsed = currentTime - startTime;
            const progress = elapsed / currentDuration;

            const gameArea = document.getElementById('gameArea');
            const maxTop = gameArea.clientHeight - 60;

            if (progress < 1) {
                document.getElementById('fallingLetter').style.top = (progress * maxTop) + 'px';
                animationFrameId = requestAnimationFrame(animateDrop);
            } else {
                // 落地未按對
                missed++;
                document.getElementById('missed').innerText = missed;
                nextQuestion();
            }
        }

        function clearHighlights() {
            keys.forEach(k => {
                const el = document.getElementById(`key-${k}`);
                if (el) el.classList.remove('active');
            });
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying || isKeyDown) return;
            isKeyDown = true;

            const pressedKey = e.key.toUpperCase();

            if (pressedKey === currentTarget) {
                score++;
                document.getElementById('score').innerText = score;
                cancelAnimationFrame(animationFrameId);
                nextQuestion();
            }
        });

        window.addEventListener('keyup', () => { isKeyDown = false; });
    </script>
</body>
</html>
