<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英打遊戲版本三 - ASDF 練習</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #fffdf9;
            --primary-accent: #e67e22;
            --active-key-bg: #fdebd0;
            --active-key-border: #e67e22;
            --text-color: #5c4b43;
            --btn-start: #78a55a;
            --btn-stop: #e76f51;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#f0e6d2 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        .header {
            width: 100%;
            max-width: 720px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            padding: 8px 18px;
            border: 2px solid #e6d7c3;
            border-radius: 20px;
            background: #fbf7f0;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #e6d7c3;
            transform: translateY(-2px);
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            color: #4a3b32;
        }

        .game-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(180, 150, 120, 0.15);
            border: 2px solid #f3e9d8;
            text-align: center;
            width: 100%;
            max-width: 720px;
        }

        .score-board {
            font-size: 20px;
            font-weight: 700;
            color: #7a685d;
            margin-bottom: 15px;
        }

        #score {
            color: var(--primary-accent);
            font-size: 32px;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .target-display {
            font-size: 72px;
            font-weight: 800;
            color: #4a3b32;
            height: 110px;
            line-height: 110px;
            margin: 15px auto;
            width: 140px;
            background: #f9f3ea;
            border-radius: 20px;
            border: 2px dashed #e2d2bc;
            transition: all 0.2s ease;
            user-select: none;
        }

        .controls {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 10px 26px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .btn-start { 
            background: var(--btn-start); 
            color: white; 
        }
        .btn-start:hover { 
            background: #68934c; 
            transform: translateY(-2px);
        }

        .btn-stop { 
            background: var(--btn-stop); 
            color: white; 
        }
        .btn-stop:hover { 
            background: #d65a3c; 
            transform: translateY(-2px);
        }

        /* 完整鍵盤面板設計 */
        .keyboard-wrapper {
            background: #f4ece1;
            padding: 20px;
            border-radius: 18px;
            border: 1px solid #e5d8c5;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .kb-row {
            display: flex;
            gap: 6px;
        }

        .key {
            width: 48px;
            height: 48px;
            border: 1px solid #dcd0bf;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
            color: #705f55;
            background: #ffffff;
            box-shadow: 0 3px 0 #d8c9b4;
            position: relative;
            user-select: none;
            transition: all 0.15s ease;
        }

        /* 空白鍵與特殊鍵樣式 */
        .key.space {
            width: 260px;
        }

        /* 提示高亮效果 (目標按鍵) */
        .key.active {
            border-color: var(--active-key-border);
            background: var(--active-key-bg);
            color: #d35400;
            box-shadow: 0 2px 0 var(--active-key-border);
            transform: translateY(2px);
        }

        .key.active::after {
            content: "";
            position: absolute;
            top: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            background-color: #e76f51;
            border-radius: 50%;
            box-shadow: 0 0 6px #e76f51;
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.5; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="../index.html" class="back-btn">← 回首頁</a>
        <h2>版本三：ASDF 練習</h2>
    </div>

    <div class="game-card">
        <div class="score-board">目前的得分：<span id="score">0</span></div>

        <div class="target-display" id="targetChar">-</div>

        <div class="controls">
            <button class="btn-start" onclick="startGame()">開始練習</button>
            <button class="btn-stop" onclick="stopGame()">停止練習</button>
        </div>

        <!-- 完整 QWERTY 鍵盤結構 -->
        <div class="keyboard-wrapper">
            <!-- 第一排 -->
            <div class="kb-row">
                <div class="key" id="key-Q">Q</div>
                <div class="key" id="key-W">W</div>
                <div class="key" id="key-E">E</div>
                <div class="key" id="key-R">R</div>
                <div class="key" id="key-T">T</div>
                <div class="key" id="key-Y">Y</div>
                <div class="key" id="key-U">U</div>
                <div class="key" id="key-I">I</div>
                <div class="key" id="key-O">O</div>
                <div class="key" id="key-P">P</div>
            </div>
            <!-- 第二排 (包含 ASDF) -->
            <div class="kb-row">
                <div class="key" id="key-A">A</div>
                <div class="key" id="key-S">S</div>
                <div class="key" id="key-D">D</div>
                <div class="key" id="key-F">F</div>
                <div class="key" id="key-G">G</div>
                <div class="key" id="key-H">H</div>
                <div class="key" id="key-J">J</div>
                <div class="key" id="key-K">K</div>
                <div class="key" id="key-L">L</div>
            </div>
            <!-- 第三排 -->
            <div class="kb-row">
                <div class="key" id="key-Z">Z</div>
                <div class="key" id="key-X">X</div>
                <div class="key" id="key-C">C</div>
                <div class="key" id="key-V">V</div>
                <div class="key" id="key-B">B</div>
                <div class="key" id="key-N">N</div>
                <div class="key" id="key-M">M</div>
            </div>
            <!-- 第四排 (Space) -->
            <div class="kb-row">
                <div class="key space">Space</div>
            </div>
        </div>
    </div>

    <script>
        // 練習依然只從 ASDF 四個字隨機出題
        const keys = ['A', 'S', 'D', 'F'];
        let currentTarget = '';
        let score = 0;
        let isPlaying = false;
        let isKeyDown = false;

        function startGame() {
            score = 0;
            isPlaying = true;
            document.getElementById('score').innerText = score;
            nextQuestion();
        }

        function stopGame() {
            isPlaying = false;
            currentTarget = '';
            document.getElementById('targetChar').innerText = '-';
            clearHighlights();
        }

        function nextQuestion() {
            if (!isPlaying) return;
            clearHighlights();
            const randomIndex = Math.floor(Math.random() * keys.length);
            currentTarget = keys[randomIndex];
            document.getElementById('targetChar').innerText = currentTarget;
            document.getElementById(`key-${currentTarget}`).classList.add('active');
        }

        function clearHighlights() {
            keys.forEach(k => {
                const el = document.getElementById(`key-${k}`);
                if (el) el.classList.remove('active');
            });
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying || isKeyDown) return;
            isKeyDown = true;

            const pressedKey = e.key.toUpperCase();

            if (pressedKey === currentTarget) {
                score++;
                const scoreEl = document.getElementById('score');
                scoreEl.innerText = score;
                scoreEl.style.transform = 'scale(1.3)';
                setTimeout(() => scoreEl.style.transform = 'scale(1)', 150);
                nextQuestion();
            }
        });

        window.addEventListener('keyup', () => {
            isKeyDown = false;
        });
    </script>
</body>
</html>
