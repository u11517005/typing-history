<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英打遊戲開發歷程</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #fffdf9;
            --text-main: #4a3b32;
            --text-sub: #7a685d;
            --border-color: #f3e9d8;
            --btn-bg: #78a55a;
            --btn-hover: #68934c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 50px 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#f0e6d2 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        h1 {
            margin-bottom: 40px;
            color: var(--text-main);
            font-size: 32px;
            font-weight: 800;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            width: 240px;
            box-shadow: 0 10px 25px rgba(180, 150, 120, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 2px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 32px rgba(180, 150, 120, 0.2);
        }

        .card h2 { margin-top: 0; font-size: 20px; color: var(--text-main); }
        .card p { color: var(--text-sub); font-size: 14px; line-height: 1.5; margin: 0; }

        .card a {
            display: block;
            text-align: center;
            padding: 10px;
            background: var(--btn-bg);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            margin-top: 20px;
            transition: all 0.2s ease;
            box-shadow: 0 3px 0 #5f8446;
        }

        .card a:hover { background: var(--btn-hover); transform: translateY(-2px); }
    </style>
</head>
<body>

    <h1>英打遊戲開發歷程網站</h1>

    <div class="container">
        <!-- 版本一 -->
        <div class="card">
            <div>
                <h2>版本一</h2>
                <p>基礎畫面與沒有互動效果的按鈕預告。</p>
            </div>
            <a href="https://u11517005.github.io/typing-v1/" target="_blank">前往版本一 ↗</a>
        </div>

        <!-- 版本二 -->
        <div class="card">
            <div>
                <h2>版本二</h2>
                <p>導入鍵盤圖片與音效資材，點擊觸發雙嗶聲。</p>
            </div>
            <a href="https://u11517005.github.io/typing-v2/" target="_blank">前往版本二 ↗</a>
        </div>

        <!-- 版本三 -->
        <div class="card">
            <div>
                <h2>版本三</h2>
                <p>左手 ASDF 鍵盤英打動態練習。</p>
            </div>
            <a href="v3/index.html">進入版本三 →</a>
        </div>

        <!-- 版本四 -->
        <div class="card">
            <div>
                <h2>版本四</h2>
                <p>十鍵掉落字母練習，挑戰反應速度！</p>
            </div>
            <a href="v4/index.html">進入版本四 →</a>
        </div>
    </div>

</body>
</html>
